<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="graticule" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#f5f3ef" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0b0b0c"/>
  <rect width="1280" height="640" fill="url(#graticule)"/>

  <!-- the README header, same order: mark, name, rule, what it is -->
  <g transform="translate(72 92)">
  <title>Swarmcraft — website builder</title>
  <g transform="translate(0 3.5) scale(3.2917)">
  
  <rect width="24" height="24" rx="5.5" fill="#0b0b0c"/><rect x="0.5" y="0.5" width="23" height="23" rx="5" fill="none" stroke="#2b2b30"/>
  <path d="M9.600000000000001 20.8 H6.2 A3 3 0 0 1 3.2 17.8 V6.2 A3 3 0 0 1 6.2 3.2 H17.8 A3 3 0 0 1 20.8 6.2 V17.8" fill="none" stroke="#f5f3ef" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(16.900000000000002 16.6) scale(0.92)"><path d="M0 0 L0 5.6 L1.45 4.2 L2.45 6.4 L3.6 5.85 L2.6 3.75 L4.6 3.5 Z" fill="#5b8cff" stroke="#0b0b0c" stroke-width="0.8" stroke-linejoin="round"/></g>
</g>
  <text x="112" y="58.910000000000004" font-family="Instrument Serif" font-size="56.760000000000005" fill="#f5f3ef">Swarmcraft</text>
  <line x1="412.036" y1="46.870000000000005" x2="412.036" y2="19.35" stroke="#8a8780" stroke-width="1" opacity="0.5"/>
  <text x="436.786" y="50.31" font-family="JetBrains Mono" font-size="17.2" letter-spacing="1.72" fill="#8a8780">WEBSITE BUILDER</text>
</g>

  
  <g>
    <rect x="180" y="238" width="920" height="286" rx="9" fill="#111113" stroke="#2b2b30"/>
    <path d="M189 238 h902 a9 9 0 0 1 9 9 v24 h-920 v-24 a9 9 0 0 1 9-9 z" fill="#171719"/>
    <line x1="180" y1="271" x2="1100" y2="271" stroke="#1f1f23"/>
    <circle cx="218" cy="255" r="4" fill="#383840"/>
    <circle cx="232" cy="255" r="4" fill="#383840"/>
    <text x="250" y="260" font-family="JetBrains Mono" font-size="14" fill="#8a8780">falconroasters.sa</text>

    <text x="214" y="350" font-family="Instrument Serif" font-size="60" fill="#f5f3ef">Roasted on Tuesday,</text>
    <text x="214" y="416" font-family="Instrument Serif" font-size="60" fill="#f5f3ef">in your cup by Thursday</text>
    <rect x="823.6" y="370" width="4" height="52" fill="#5b8cff"/>

    <line x1="214" y1="430" x2="1066" y2="430" stroke="#1f1f23"/>

    <!-- Two priced rows, laid out as measured rules rather than cards. Nothing
         overlaps the headline: the caret already sits at the end of it, and a
         second mark in the same 40px reads as a mistake, not as work. -->
    
    <text x="214" y="472" font-family="Instrument Sans" font-size="20" fill="#b6b3ac">Espresso Roast</text>
    <text x="1066" y="472" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#8a8780">SAR 65</text>
    <line x1="214" y1="488" x2="1066" y2="488" stroke="#1f1f23" opacity="0.7"/>
    <text x="214" y="512" font-family="Instrument Sans" font-size="20" fill="#b6b3ac">Filter Papers</text>
    <text x="1066" y="512" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#8a8780">SAR 12</text>
    <line x1="214" y1="528" x2="1066" y2="528" stroke="#1f1f23" opacity="0.7"/>

    <!-- One gesture says "not finished yet": the sheet's own corner, still
         being dragged. A second half-drawn block inside the page competed with
         the content and made the whole thing read as clutter, so there is one. -->
    <path d="M1036 524 h48" stroke="#5b8cff" stroke-width="3" stroke-linecap="round"/>
    <rect x="1078" y="518" width="12" height="12" fill="#5b8cff"/>

    
    <g transform="translate(1086.1999999999998 519.71) scale(1.6666666666666667)">
      <path d="M3 2 L3 19 L8 14.4 L11.2 21 L14.4 19.4 L11.2 13 L18 12.6 Z" fill="#5b8cff" stroke="#0b0b0c" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    
    <g transform="translate(640 260.88) scale(1.4166666666666667)">
      <path d="M3 2 L3 19 L8 14.4 L11.2 21 L14.4 19.4 L11.2 13 L18 12.6 Z" fill="#3dd68c" stroke="#0b0b0c" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    
    <g transform="translate(364 415.32) scale(1.4166666666666667)">
      <path d="M3 2 L3 19 L8 14.4 L11.2 21 L14.4 19.4 L11.2 13 L18 12.6 Z" fill="#f0a92e" stroke="#0b0b0c" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    
    <g transform="translate(971.1999999999999 495.40000000000003) scale(1.4166666666666667)">
      <path d="M3 2 L3 19 L8 14.4 L11.2 21 L14.4 19.4 L11.2 13 L18 12.6 Z" fill="#35c6dd" stroke="#0b0b0c" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="72" y="600" font-family="JetBrains Mono" font-size="19" fill="#f5f3ef">github.com/mafk21/swarmcraft</text>
  <text x="1208" y="600" text-anchor="end" font-family="JetBrains Mono" font-size="17" letter-spacing="3" fill="#5d5b55">ONE REQUEST · 80 SECONDS · MIT</text>
</svg>