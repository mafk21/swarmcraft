  <text x="76" y="188" font-family="JetBrains Mono" font-size="22" letter-spacing="6" fill="#8a8780">SWARMSMITH</text>
  <line x1="76" y1="216" x2="1004" y2="216" stroke="#2b2b30"/>

  <text x="72" y="404" font-family="Instrument Serif" font-size="176" fill="#f5f3ef">Your website,</text>
  <text x="72" y="576" font-family="Instrument Serif" font-size="176" fill="#f5f3ef">drawn</text>
  <text x="72" y="748" font-family="Instrument Serif" font-size="176" font-style="italic" fill="#ff9548">in front of you.</text>

  
  <g>
    <rect x="76" y="806" width="928" height="660" rx="8" fill="#111113" stroke="#2b2b30"/>
