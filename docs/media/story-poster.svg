    <text x="120" y="1112" font-family="Instrument Sans" font-size="26" fill="#b6b3ac">Espresso Roast</text>
    <text x="960" y="1112" text-anchor="end" font-family="JetBrains Mono" font-size="24" fill="#8a8780">SAR 65</text>
