  <text x="84" y="330" font-family="Instrument Serif" font-size="88" fill="#f5f3ef">Write a brief.</text>
  <text x="84" y="426" font-family="Instrument Serif" font-size="88" fill="#f5f3ef">Watch it get built.</text>

  <text x="84" y="528" font-family="Instrument Sans" font-size="31" fill="#b6b3ac">Nine cursors draw your website — dragging the boxes out,</text>
  <text x="84" y="572" font-family="Instrument Sans" font-size="31" fill="#b6b3ac">typing the headline, stamping the cards — then the real</text>
  <text x="84" y="616" font-family="Instrument Sans" font-size="31" fill="#b6b3ac">page fades in underneath.</text>

  
